<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>减肥计划倒计时</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  color: #333;
}
.container { max-width: 900px; margin: 0 auto; padding: 16px; }

/* Header */
.header { text-align: center; color: #fff; margin-bottom: 24px; }
.header h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
.header p { font-size: 14px; opacity: 0.85; }

/* Countdown */
.countdown-box {
  background: rgba(255,255,255,0.95);
  border-radius: 16px;
  padding: 24px 16px;
  text-align: center;
  margin-bottom: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.countdown-label { font-size: 14px; color: #888; margin-bottom: 10px; }
.countdown-numbers { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.cd-unit { display: flex; flex-direction: column; align-items: center; }
.cd-num { font-size: 36px; font-weight: 800; color: #764ba2; line-height: 1; font-variant-numeric: tabular-nums; }
.cd-text { font-size: 11px; color: #aaa; margin-top: 4px; }
.cd-sep { font-size: 32px; font-weight: 800; color: #ddd; line-height: 1; }
.countdown-target { margin-top: 12px; font-size: 14px; color: #666; }

/* Stats Summary */
.stats-box {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  flex: 1;
  background: rgba(255,255,255,0.95);
  border-radius: 12px;
  padding: 14px 10px;
  text-align: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
}
.stat-label { font-size: 12px; color: #999; margin-bottom: 4px; }
.stat-value { font-size: 20px; font-weight: 800; color: #764ba2; font-variant-numeric: tabular-nums; }
.stat-delta { font-size: 12px; margin-top: 2px; }
.stat-delta.down { color: #2ecc71; }
.stat-delta.up { color: #e74c3c; }
.stat-delta.flat { color: #999; }

/* Calendar */
.calendar-box {
  background: rgba(255,255,255,0.95);
  border-radius: 16px;
  padding: 20px 16px;
  margin-bottom: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.cal-nav {
  background: #764ba2; color: #fff; border: none; border-radius: 8px;
  width: 34px; height: 34px; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.cal-nav:hover { background: #5a3580; }
.cal-title { font-size: 17px; font-weight: 700; color: #333; }
.cal-legend {
  display: flex; gap: 14px; margin-bottom: 10px; font-size: 11px; color: #888; flex-wrap: wrap;
}
.cal-legend span { display: flex; align-items: center; gap: 4px; }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 6px; }
.cal-weekday { font-size: 12px; color: #999; font-weight: 600; padding: 4px 0; }
.cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-day {
  min-height: 64px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  border-radius: 8px; padding: 4px 2px; cursor: pointer; position: relative;
  transition: all 0.2s; background: #f8f8f8; color: #555;
}
.cal-day:hover { background: #ede4f5; }
.cal-day.other-month { color: #ccc; background: #fcfcfc; min-height: 64px; }
.cal-day-num { font-size: 13px; font-weight: 600; line-height: 1.2; }
.cal-day.today { background: #764ba2; color: #fff; }
.cal-day.today .cal-day-num { font-weight: 800; }
.cal-day.target { background: #e8412e; color: #fff; }
.cal-day.target .cal-day-num { font-weight: 800; }
.cal-day.selected { box-shadow: 0 0 0 2px #667eea; }
.cal-day-icons { font-size: 11px; line-height: 1; margin-top: 2px; display: flex; gap: 1px; }
.cal-day-weight { font-size: 10px; font-weight: 700; margin-top: 1px; font-variant-numeric: tabular-nums; }
.cal-day-delta { font-size: 9px; font-variant-numeric: tabular-nums; }
.cal-day-delta.down { color: #2ecc71; }
.cal-day-delta.up { color: #e74c3c; }
.cal-day.today .cal-day-delta.down,
.cal-day.today .cal-day-delta.up,
.cal-day.target .cal-day-delta.down,
.cal-day.target .cal-day-delta.up { color: rgba(255,255,255,0.85); }

/* Record Section */
.record-box {
  background: rgba(255,255,255,0.95);
  border-radius: 16px;
  padding: 20px 16px;
  margin-bottom: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.record-date { font-size: 17px; font-weight: 700; color: #333; margin-bottom: 14px; text-align: center; }
.record-section { margin-bottom: 16px; }
.record-section:last-child { margin-bottom: 0; }
.record-section-title {
  font-size: 14px; font-weight: 700; color: #764ba2; margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.record-section-title .icon { font-size: 16px; }
.weight-input-row { display: flex; align-items: center; gap: 10px; }
.weight-input {
  width: 120px; border: 2px solid #e0e0e0; border-radius: 10px; padding: 8px 12px;
  font-size: 16px; font-family: inherit; font-weight: 700; text-align: center;
  font-variant-numeric: tabular-nums; transition: border-color 0.2s;
}
.weight-input:focus { outline: none; border-color: #764ba2; }
.weight-unit { font-size: 14px; color: #888; }
.weight-delta-hint { font-size: 13px; color: #aaa; margin-left: 8px; }
.weight-delta-hint.down { color: #2ecc71; }
.weight-delta-hint.up { color: #e74c3c; }
.record-textarea {
  width: 100%; min-height: 80px; border: 2px solid #e0e0e0; border-radius: 10px;
  padding: 10px; font-size: 14px; font-family: inherit; resize: vertical;
  transition: border-color 0.2s; line-height: 1.6;
}
.record-textarea:focus { outline: none; border-color: #764ba2; }
.record-actions { display: flex; gap: 12px; margin-top: 14px; justify-content: center; }
.btn {
  border: none; border-radius: 10px; padding: 10px 28px; font-size: 15px;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.btn-save { background: #764ba2; color: #fff; }
.btn-save:hover { background: #5a3580; transform: translateY(-1px); }
.btn-clear { background: #e0e0e0; color: #666; }
.btn-clear:hover { background: #d0d0d0; }
.record-hint { text-align: center; font-size: 12px; color: #aaa; margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🏃 减肥计划</h1>
    <p>坚持就是胜利，从今天到 9.20 一起加油！</p>
  </div>

  <div class="countdown-box">
    <div class="countdown-label">距离目标还有</div>
    <div class="countdown-numbers" id="countdown"></div>
    <div class="countdown-target" id="countdown-target"></div>
  </div>

  <div class="stats-box" id="stats-box"></div>

  <div class="calendar-box">
    <div class="cal-header">
      <button class="cal-nav" id="prev-month">‹</button>
      <div class="cal-title" id="cal-title"></div>
      <button class="cal-nav" id="next-month">›</button>
    </div>
    <div class="cal-legend">
      <span>🍽️ 有饮食记录</span>
      <span>🏃 有运动记录</span>
      <span>⚖️ 体重数值（含差值）</span>
    </div>
    <div class="cal-weekdays" id="cal-weekdays"></div>
    <div class="cal-days" id="cal-days"></div>
  </div>

  <div class="record-box">
    <div class="record-date" id="record-date"></div>
    <div class="record-section">
      <div class="record-section-title"><span class="icon">⚖️</span> 体重（kg）</div>
      <div class="weight-input-row">
        <input type="number" class="weight-input" id="weight-input" placeholder="0.0" step="0.1" min="0" max="500">
        <span class="weight-unit">kg</span>
        <span class="weight-delta-hint" id="weight-delta-hint"></span>
      </div>
    </div>
    <div class="record-section">
      <div class="record-section-title"><span class="icon">🍽️</span> 今日饮食</div>
      <textarea class="record-textarea" id="diet-input" placeholder="记录你今天吃了什么……&#10;例：早餐：燕麦粥+鸡蛋&#10;午餐：鸡胸肉沙拉&#10;晚餐：蔬菜汤"></textarea>
    </div>
    <div class="record-section">
      <div class="record-section-title"><span class="icon">💪</span> 今日运动</div>
      <textarea class="record-textarea" id="exercise-input" placeholder="记录你今天的运动……&#10;例：跑步 30 分钟&#10;跳绳 15 分钟&#10;仰卧起坐 50 个"></textarea>
    </div>
    <div class="record-actions">
      <button class="btn btn-save" id="save-btn">💾 保存记录</button>
      <button class="btn btn-clear" id="clear-btn">🗑️ 清除</button>
    </div>
    <div class="record-hint">数据保存在本地浏览器中，不会丢失</div>
  </div>
</div>

<script>
const TARGET_DATE = new Date('2026-09-20T00:00:00');
const STORAGE_KEY = 'diet_records_v2';
const WEEKDAYS = ['日','一','二','三','四','五','六'];
const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

let currentMonth = new Date();
let selectedDate = new Date();
selectedDate.setHours(0,0,0,0);

// ===== Storage =====
function loadRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch(e) { return {}; }
}
function saveRecords(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDateKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m-1, d);
}

// 获取前一天有体重记录的日期和数值
function getPrevWeight(records, dateObj) {
  let d = new Date(dateObj);
  for (let i = 0; i < 400; i++) {
    d.setDate(d.getDate() - 1);
    const k = dateKey(d);
    if (records[k] && records[k].weight) {
      return { date: d, weight: parseFloat(records[k].weight) };
    }
  }
  return null;
}

// ===== Countdown =====
function updateCountdown() {
  const now = new Date();
  let diff = Math.max(0, TARGET_DATE - now);
  const days = Math.floor(diff / 86400000);
  diff -= days * 86400000;
  const hours = Math.floor(diff / 3600000);
  diff -= hours * 3600000;
  const mins = Math.floor(diff / 60000);
  diff -= mins * 60000;
  const secs = Math.floor(diff / 1000);
  document.getElementById('countdown').innerHTML = `
    <div class="cd-unit"><div class="cd-num">${days}</div><div class="cd-text">天</div></div>
    <div class="cd-sep">:</div>
    <div class="cd-unit"><div class="cd-num">${String(hours).padStart(2,'0')}</div><div class="cd-text">时</div></div>
    <div class="cd-sep">:</div>
    <div class="cd-unit"><div class="cd-num">${String(mins).padStart(2,'0')}</div><div class="cd-text">分</div></div>
    <div class="cd-sep">:</div>
    <div class="cd-unit"><div class="cd-num">${String(secs).padStart(2,'0')}</div><div class="cd-text">秒</div></div>`;
  document.getElementById('countdown-target').textContent = `目标日期：2026年9月20日`;
}
setInterval(updateCountdown, 1000);
updateCountdown();

// ===== Stats Summary =====
function renderStats() {
  const records = loadRecords();
  const allKeys = Object.keys(records).sort();
  // 最新体重
  let latestWeight = null, latestWeightDate = null;
  for (let i = allKeys.length - 1; i >= 0; i--) {
    if (records[allKeys[i]].weight) {
      latestWeight = parseFloat(records[allKeys[i]].weight);
      latestWeightDate = parseDateKey(allKeys[i]);
      break;
    }
  }
  // 第一个体重记录
  let firstWeight = null;
  for (const k of allKeys) {
    if (records[k].weight) {
      firstWeight = parseFloat(records[k].weight);
      break;
    }
  }
  // 有记录的天数
  let recordDays = 0;
  for (const k of allKeys) {
    if (records[k].diet || records[k].exercise || records[k].weight) recordDays++;
  }

  // 前一天体重（用于显示差值）
  let prevW = null;
  if (latestWeightDate) {
    const prev = getPrevWeight(records, latestWeightDate);
    if (prev) prevW = prev.weight;
  }

  const totalDelta = (latestWeight && firstWeight) ? (latestWeight - firstWeight) : null;
  const dailyDelta = (latestWeight && prevW != null) ? (latestWeight - prevW) : null;

  function deltaHtml(val) {
    if (val == null) return '<span class="stat-delta flat">—</span>';
    if (val > 0) return `<span class="stat-delta up">↑${val.toFixed(1)}kg</span>`;
    if (val < 0) return `<span class="stat-delta down">↓${Math.abs(val).toFixed(1)}kg</span>`;
    return `<span class="stat-delta flat">持平</span>`;
  }

  document.getElementById('stats-box').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">当前体重</div>
      <div class="stat-value">${latestWeight ? latestWeight.toFixed(1) : '—'}</div>
      ${dailyDelta != null ? deltaHtml(dailyDelta) : '<span class="stat-delta flat">—</span>'}
    </div>
    <div class="stat-card">
      <div class="stat-label">累计变化</div>
      <div class="stat-value">${totalDelta != null ? (totalDelta > 0 ? '+' : '') + totalDelta.toFixed(1) : '—'}</div>
      ${totalDelta != null ? deltaHtml(totalDelta) : '<span class="stat-delta flat">—</span>'}
    </div>
    <div class="stat-card">
      <div class="stat-label">打卡天数</div>
      <div class="stat-value">${recordDays}</div>
      <span class="stat-delta flat">天</span>
    </div>`;
}

// ===== Calendar =====
function renderWeekdays() {
  document.getElementById('cal-weekdays').innerHTML =
    WEEKDAYS.map(w => `<div class="cal-weekday">${w}</div>`).join('');
}

function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  document.getElementById('cal-title').textContent = `${year}年 ${MONTHS[month]}`;

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startWeekday = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const prevLastDay = new Date(year, month, 0).getDate();

  const records = loadRecords();
  const today = new Date();
  today.setHours(0,0,0,0);

  function buildDayCell(d, isOtherMonth) {
    const date = new Date(year, month, d);
    date.setHours(0,0,0,0);
    const key = dateKey(date);
    const rec = records[key] || {};
    const hasDiet = !!rec.diet;
    const hasExercise = !!rec.exercise;
    const hasWeight = !!rec.weight;
    const weight = hasWeight ? parseFloat(rec.weight) : null;
    const isToday = date.getTime() === today.getTime();
    const isTarget = date.getTime() === TARGET_DATE.getTime();
    const isSelected = date.getTime() === selectedDate.getTime();

    // 计算体重差值（前一天有体重记录）
    let deltaHtml = '';
    if (weight != null) {
      const prev = getPrevWeight(records, date);
      if (prev) {
        const delta = weight - prev.weight;
        if (delta > 0) deltaHtml = `<div class="cal-day-delta up">↑${delta.toFixed(1)}</div>`;
        else if (delta < 0) deltaHtml = `<div class="cal-day-delta down">↓${Math.abs(delta).toFixed(1)}</div>`;
        else deltaHtml = `<div class="cal-day-delta flat">→0.0</div>`;
      }
    }

    let classes = 'cal-day';
    if (isOtherMonth) classes += ' other-month';
    if (isToday) classes += ' today';
    if (isTarget) classes += ' target';
    if (isSelected) classes += ' selected';

    // 图标行
    let iconsHtml = '';
    const icons = [];
    if (hasDiet) icons.push('🍽️');
    if (hasExercise) icons.push('🏃');
    if (icons.length) iconsHtml = `<div class="cal-day-icons">${icons.join('')}</div>`;

    // 体重行
    let weightHtml = '';
    if (weight != null) {
      weightHtml = `<div class="cal-day-weight">${weight.toFixed(1)}</div>${deltaHtml}`;
    }

    if (isOtherMonth) {
      return `<div class="${classes}"><div class="cal-day-num">${d}</div></div>`;
    }
    return `<div class="${classes}" data-date="${key}">
      <div class="cal-day-num">${d}</div>
      ${iconsHtml}
      ${weightHtml}
    </div>`;
  }

  let html = '';
  for (let i = startWeekday - 1; i >= 0; i--) {
    html += buildDayCell(prevLastDay - i, true);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    html += buildDayCell(d, false);
  }
  const totalCells = startWeekday + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    html += buildDayCell(i, true);
  }

  document.getElementById('cal-days').innerHTML = html;

  document.querySelectorAll('.cal-day[data-date]').forEach(el => {
    el.addEventListener('click', () => {
      selectedDate = new Date(el.dataset.date);
      selectedDate.setHours(0,0,0,0);
      renderCalendar();
      loadRecord();
    });
  });
}

// ===== Record =====
function loadRecord() {
  const key = dateKey(selectedDate);
  const records = loadRecords();
  const record = records[key] || {};

  const dateStr = `${selectedDate.getFullYear()}年${selectedDate.getMonth()+1}月${selectedDate.getDate()}日（${WEEKDAYS[selectedDate.getDay()]}）`;
  document.getElementById('record-date').textContent = dateStr;
  document.getElementById('weight-input').value = record.weight || '';
  document.getElementById('diet-input').value = record.diet || '';
  document.getElementById('exercise-input').value = record.exercise || '';

  // 体重差值提示
  updateWeightHint();
}

function updateWeightHint() {
  const records = loadRecords();
  const currentW = parseFloat(document.getElementById('weight-input').value);
  const hint = document.getElementById('weight-delta-hint');
  if (isNaN(currentW)) {
    hint.textContent = '';
    hint.className = 'weight-delta-hint';
    return;
  }
  const prev = getPrevWeight(records, selectedDate);
  if (prev) {
    const delta = currentW - prev.weight;
    if (delta > 0) {
      hint.textContent = `比前次 ↑${delta.toFixed(1)}kg`;
      hint.className = 'weight-delta-hint up';
    } else if (delta < 0) {
      hint.textContent = `比前次 ↓${Math.abs(delta).toFixed(1)}kg`;
      hint.className = 'weight-delta-hint down';
    } else {
      hint.textContent = '与前次持平';
      hint.className = 'weight-delta-hint flat';
    }
  } else {
    hint.textContent = '首次记录';
    hint.className = 'weight-delta-hint';
  }
}

document.getElementById('weight-input').addEventListener('input', updateWeightHint);

document.getElementById('save-btn').addEventListener('click', () => {
  const key = dateKey(selectedDate);
  const records = loadRecords();
  const weight = document.getElementById('weight-input').value;
  records[key] = {
    weight: weight || undefined,
    diet: document.getElementById('diet-input').value || undefined,
    exercise: document.getElementById('exercise-input').value || undefined,
    savedAt: new Date().toISOString()
  };
  saveRecords(records);
  renderCalendar();
  renderStats();
  const btn = document.getElementById('save-btn');
  const orig = btn.textContent;
  btn.textContent = '✅ 已保存';
  btn.disabled = true;
  setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
});

document.getElementById('clear-btn').addEventListener('click', () => {
  document.getElementById('weight-input').value = '';
  document.getElementById('diet-input').value = '';
  document.getElementById('exercise-input').value = '';
  updateWeightHint();
});

document.getElementById('prev-month').addEventListener('click', () => {
  currentMonth.setMonth(currentMonth.getMonth() - 1);
  renderCalendar();
});
document.getElementById('next-month').addEventListener('click', () => {
  currentMonth.setMonth(currentMonth.getMonth() + 1);
  renderCalendar();
});

// ===== Init =====
renderWeekdays();
renderCalendar();
renderStats();
loadRecord();
</script>
</body>
</html>
