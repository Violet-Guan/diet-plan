<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>减肥计划倒计时</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  color: #333;
}
.container { max-width: 800px; margin: 0 auto; padding: 20px; }

/* Header */
.header {
  text-align: center;
  color: #fff;
  margin-bottom: 30px;
}
.header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.header p { font-size: 14px; opacity: 0.85; }

/* Countdown */
.countdown-box {
  background: rgba(255,255,255,0.95);
  border-radius: 16px;
  padding: 30px 20px;
  text-align: center;
  margin-bottom: 24px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.countdown-label { font-size: 14px; color: #888; margin-bottom: 12px; }
.countdown-numbers {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}
.cd-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.cd-num {
  font-size: 40px;
  font-weight: 800;
  color: #764ba2;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.cd-text { font-size: 12px; color: #aaa; margin-top: 6px; }
.cd-sep {
  font-size: 36px;
  font-weight: 800;
  color: #ddd;
  line-height: 1;
}
.countdown-target {
  margin-top: 16px;
  font-size: 14px;
  color: #666;
}

/* Calendar */
.calendar-box {
  background: rgba(255,255,255,0.95);
  border-radius: 16px;
  padding: 24px 20px;
  margin-bottom: 24px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.cal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.cal-nav {
  background: #764ba2;
  color: #fff;
  border: none;
  border-radius: 8px;
  width: 36px;
  height: 36px;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}
.cal-nav:hover { background: #5a3580; }
.cal-title { font-size: 18px; font-weight: 700; color: #333; }
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  margin-bottom: 8px;
}
.cal-weekday { font-size: 12px; color: #999; font-weight: 600; padding: 4px 0; }
.cal-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  position: relative;
  transition: all 0.2s;
  background: #f8f8f8;
  color: #555;
}
.cal-day:hover { background: #e8e0f0; }
.cal-day.other-month { color: #ccc; background: #fafafa; }
.cal-day.today {
  background: #764ba2;
  color: #fff;
  font-weight: 700;
}
.cal-day.has-record {
  border: 2px solid #667eea;
}
.cal-day.today.has-record {
  border: 2px solid #fff;
}
.cal-day.target {
  background: #e8412e;
  color: #fff;
  font-weight: 700;
}
.cal-day-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #667eea;
  margin-top: 2px;
}
.cal-day.today .cal-day-dot { background: #fff; }
.cal-day.target .cal-day-dot { background: #fff; }

/* Record Section */
.record-box {
  background: rgba(255,255,255,0.95);
  border-radius: 16px;
  padding: 24px 20px;
  margin-bottom: 24px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.record-date {
  font-size: 18px;
  font-weight: 700;
  color: #333;
  margin-bottom: 16px;
  text-align: center;
}
.record-section { margin-bottom: 20px; }
.record-section:last-child { margin-bottom: 0; }
.record-section-title {
  font-size: 15px;
  font-weight: 700;
  color: #764ba2;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.record-section-title .icon { font-size: 18px; }
.record-textarea {
  width: 100%;
  min-height: 100px;
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  padding: 12px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  transition: border-color 0.2s;
  line-height: 1.6;
}
.record-textarea:focus { outline: none; border-color: #764ba2; }
.record-actions {
  display: flex;
  gap: 12px;
  margin-top: 16px;
  justify-content: center;
}
.btn {
  border: none;
  border-radius: 10px;
  padding: 10px 32px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-save { background: #764ba2; color: #fff; }
.btn-save:hover { background: #5a3580; transform: translateY(-1px); }
.btn-clear { background: #e0e0e0; color: #666; }
.btn-clear:hover { background: #d0d0d0; }
.record-hint {
  text-align: center;
  font-size: 13px;
  color: #aaa;
  margin-top: 12px;
}
.empty-hint {
  text-align: center;
  color: #bbb;
  font-size: 14px;
  padding: 20px;
}
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>🏃 减肥计划</h1>
    <p>坚持就是胜利，从今天到 9.20 一起加油！</p>
  </div>

  <!-- Countdown -->
  <div class="countdown-box">
    <div class="countdown-label">距离目标还有</div>
    <div class="countdown-numbers" id="countdown"></div>
    <div class="countdown-target" id="countdown-target"></div>
  </div>

  <!-- Calendar -->
  <div class="calendar-box">
    <div class="cal-header">
      <button class="cal-nav" id="prev-month">‹</button>
      <div class="cal-title" id="cal-title"></div>
      <button class="cal-nav" id="next-month">›</button>
    </div>
    <div class="cal-weekdays" id="cal-weekdays"></div>
    <div class="cal-days" id="cal-days"></div>
  </div>

  <!-- Record -->
  <div class="record-box" id="record-box">
    <div class="record-date" id="record-date"></div>
    <div class="record-section">
      <div class="record-section-title"><span class="icon">🍽️</span> 今日饮食</div>
      <textarea class="record-textarea" id="diet-input" placeholder="记录你今天吃了什么……&#10;例：早餐：燕麦粥+鸡蛋&#10;午餐：鸡胸肉沙拉&#10;晚餐：蔬菜汤"></textarea>
    </div>
    <div class="record-section">
      <div class="record-section-title"><span class="icon">💪</span> 今日运动</div>
      <textarea class="record-textarea" id="exercise-input" placeholder="记录你今天的运动……&#10;例：跑步 30 分钟&#10;跳绳 15 分钟&#10;仰卧起坐 50 个"></textarea>
    </div>
    <div class="record-actions">
      <button class="btn btn-save" id="save-btn">💾 保存记录</button>
      <button class="btn btn-clear" id="clear-btn">🗑️ 清除</button>
    </div>
    <div class="record-hint">数据保存在本地浏览器中，不会丢失</div>
  </div>
</div>

<script>
// ===== Config =====
const TARGET_DATE = new Date('2025-09-20T00:00:00');
const STORAGE_KEY = 'diet_records_v1';
const WEEKDAYS = ['日','一','二','三','四','五','六'];
const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

// ===== State =====
let currentMonth = new Date();
let selectedDate = new Date();
selectedDate.setHours(0,0,0,0);

// ===== Storage =====
function loadRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch(e) { return {}; }
}
function saveRecords(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// ===== Countdown =====
function updateCountdown() {
  const now = new Date();
  let diff = Math.max(0, TARGET_DATE - now);
  const days = Math.floor(diff / 86400000);
  diff -= days * 86400000;
  const hours = Math.floor(diff / 3600000);
  diff -= hours * 3600000;
  const mins = Math.floor(diff / 60000);
  diff -= mins * 60000;
  const secs = Math.floor(diff / 1000);

  document.getElementById('countdown').innerHTML = `
    <div class="cd-unit"><div class="cd-num">${days}</div><div class="cd-text">天</div></div>
    <div class="cd-sep">:</div>
    <div class="cd-unit"><div class="cd-num">${String(hours).padStart(2,'0')}</div><div class="cd-text">时</div></div>
    <div class="cd-sep">:</div>
    <div class="cd-unit"><div class="cd-num">${String(mins).padStart(2,'0')}</div><div class="cd-text">分</div></div>
    <div class="cd-sep">:</div>
    <div class="cd-unit"><div class="cd-num">${String(secs).padStart(2,'0')}</div><div class="cd-text">秒</div></div>
  `;
  document.getElementById('countdown-target').textContent =
    `目标日期：2025年9月20日`;
}
setInterval(updateCountdown, 1000);
updateCountdown();

// ===== Calendar =====
function renderWeekdays() {
  document.getElementById('cal-weekdays').innerHTML =
    WEEKDAYS.map(w => `<div class="cal-weekday">${w}</div>`).join('');
}

function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  document.getElementById('cal-title').textContent = `${year}年 ${MONTHS[month]}`;

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startWeekday = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const prevLastDay = new Date(year, month, 0).getDate();

  const records = loadRecords();
  const today = new Date();
  today.setHours(0,0,0,0);

  let html = '';
  // Previous month tail
  for (let i = startWeekday - 1; i >= 0; i--) {
    const d = prevLastDay - i;
    html += `<div class="cal-day other-month">${d}</div>`;
  }
  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    date.setHours(0,0,0,0);
    const key = dateKey(date);
    const hasRecord = records[key] && (records[key].diet || records[key].exercise);
    const isToday = date.getTime() === today.getTime();
    const isTarget = date.getTime() === TARGET_DATE.getTime();
    const isSelected = date.getTime() === selectedDate.getTime();

    let classes = 'cal-day';
    if (isToday) classes += ' today';
    if (isTarget) classes += ' target';
    if (isSelected && !isToday && !isTarget) classes += ' selected';

    let style = '';
    if (isSelected && !isToday && !isTarget) {
      style = 'style="background:#e8e0f0;font-weight:700;"';
    }

    html += `<div class="${classes}" ${style} data-date="${key}">
      ${d}
      ${hasRecord ? '<div class="cal-day-dot"></div>' : ''}
    </div>`;
  }
  // Next month head
  const totalCells = startWeekday + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="cal-day other-month">${i}</div>`;
  }

  document.getElementById('cal-days').innerHTML = html;

  // Bind clicks
  document.querySelectorAll('.cal-day[data-date]').forEach(el => {
    el.addEventListener('click', () => {
      selectedDate = new Date(el.dataset.date);
      selectedDate.setHours(0,0,0,0);
      renderCalendar();
      loadRecord();
    });
  });
}

// ===== Record =====
function loadRecord() {
  const key = dateKey(selectedDate);
  const records = loadRecords();
  const record = records[key] || {};

  const dateStr = `${selectedDate.getFullYear()}年${selectedDate.getMonth()+1}月${selectedDate.getDate()}日（${WEEKDAYS[selectedDate.getDay()]}）`;
  document.getElementById('record-date').textContent = dateStr;
  document.getElementById('diet-input').value = record.diet || '';
  document.getElementById('exercise-input').value = record.exercise || '';
}

document.getElementById('save-btn').addEventListener('click', () => {
  const key = dateKey(selectedDate);
  const records = loadRecords();
  records[key] = {
    diet: document.getElementById('diet-input').value,
    exercise: document.getElementById('exercise-input').value,
    savedAt: new Date().toISOString()
  };
  saveRecords(records);
  renderCalendar();
  // Feedback
  const btn = document.getElementById('save-btn');
  const orig = btn.textContent;
  btn.textContent = '✅ 已保存';
  btn.disabled = true;
  setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
});

document.getElementById('clear-btn').addEventListener('click', () => {
  document.getElementById('diet-input').value = '';
  document.getElementById('exercise-input').value = '';
});

document.getElementById('prev-month').addEventListener('click', () => {
  currentMonth.setMonth(currentMonth.getMonth() - 1);
  renderCalendar();
});
document.getElementById('next-month').addEventListener('click', () => {
  currentMonth.setMonth(currentMonth.getMonth() + 1);
  renderCalendar();
});

// ===== Init =====
renderWeekdays();
renderCalendar();
loadRecord();
</script>
</body>
</html>
